blueprint:
  source_url: "https://raw.githubusercontent.com/tefracky-organization/homeassistant-blueprints/refs/heads/blueprints/scripts/notification-send.yaml"
  name: Benachrichtigung senden (Android & Persistent)
  description: >
    # 📢 Benachrichtigung senden

    Zentrales Skript für Android/iOS-Benachrichtigungen an eine Geräteliste – optional zusätzlich als
    persistente Benachrichtigung in Home Assistant. Wird vom Automation-Blueprint
    `notifications.yaml` und von vielen weiteren Automationen als `script.notification_send` aufgerufen.

    Die Geräte werden **im Blueprint** gepflegt (Standard- und Arbeitsgeräte), beim Aufruf kann über
    das Feld `notify_devices` eine eigene Geräteliste übergeben werden.

    ## **Version 2.1**

    - 🎨 **Eigenes Icon und Icon-Farbe (nur Android)**
      - Neue optionale Felder `notify_icon` (z. B. `mdi:garage-alert`) und `notify_icon_color`
        (RGB-Liste wie `[255, 152, 0]` oder Hex-String wie `#ff9800`). Ohne Angabe bleibt das HA-Standard-Icon.

    - 🔍 **Mehr Traces**
      - `trace: stored_traces: 20`, damit bei vielen Aufrufern ältere Läufe nachvollziehbar bleiben.

    ## **Version 2.0**

    - 🔄 **Neu aufgebaut als Abbild des produktiven `script.notification_send`**
      - Die alte Blueprint-Version (`send_car`, fest verdrahtete Geräte) war nicht mehr im Einsatz und ist ersetzt.
      - Felder und Verhalten entsprechen 1:1 dem bisherigen UI-Skript – Aufrufer müssen nichts ändern.

    - 📱 **Geräte als Blueprint-Inputs**
      - Standard- und Arbeitsgeräte werden per Geräte-Auswahl gepflegt statt als fest verdrahtete IDs im Template.

    - 🐞 **Bugfix: relativer Zeitstempel**
      - `notify_when_relative` (Sekunden) wird jetzt in einen echten Zeitstempel (jetzt + N Sekunden) umgerechnet.
        Vorher wurde der Sekundenwert direkt als Unix-Zeitstempel übergeben (→ 1970).

    - 🧩 **Telegram-Schritte parametrisiert**
      - Die (deaktivierten) Telegram-Schritte nutzen einen Config-Entry-Input statt einer fest eingetragenen ID.
  domain: script
  homeassistant:
    min_version: "2024.10.0"
  input:
    devices_section:
      name: "📱 Geräte"
      icon: mdi:cellphone
      collapsed: false
      input:
        default_devices:
          name: Standardgeräte
          description: >
            Mobile-App-Geräte, die eine Benachrichtigung erhalten, wenn beim Aufruf keine eigene
            Geräteliste (`notify_devices`) übergeben wird.
          default: []
          selector:
            device:
              multiple: true
              filter:
                - integration: mobile_app
        work_devices:
          name: Arbeitsgeräte
          description: >
            Zusätzliche Geräte, die bei `send_to_work: true` an die Standardgeräte angehängt werden.
          default: []
          selector:
            device:
              multiple: true
              filter:
                - integration: mobile_app
    telegram_section:
      name: "✈️ Telegram (experimentell)"
      icon: mdi:send
      collapsed: true
      input:
        telegram_config_entry:
          name: Telegram-Bot
          description: >
            Config-Entry des Telegram-Bots für die (aktuell deaktivierten) Telegram-Schritte.
          default: ""
          selector:
            config_entry:
              integration: telegram_bot

mode: queued

trace:
  stored_traces: 20

fields:
  notify_title:
    name: Benachrichtigungstitel
    description: Titel, der für Android- und persistente Benachrichtigungen verwendet wird.
    default: "📢 Gebe hier den Benachrichtigungstitel ein"
    required: true
    selector:
      text:
  notify_message:
    name: Benachrichtigungsnachricht
    description: Nachricht, die als Android-Meldung und persistent angezeigt wird.
    default: "Gebe hier die Benachrichtigungsnachricht ein 🙂"
    required: true
    selector:
      text:
        multiline: true
  notify_data:
    name: Android-spezifische Optionen (Optional)
    description: "Optionale Parameter: high_priority, sticky; Kanalname wird benötigt."
    default: []
    required: false
    selector:
      select:
        multiple: true
        options:
          - label: Hochpriorität
            value: high_priority
          - label: Feste Benachrichtigung (Sticky)
            value: sticky
          - label: Nur einmal benachrichtigen
            value: alert_once
  notify_tag:
    name: Benachrichtigungstag
    description: "**Hinweis:** Bitte ausschließlich Kleinbuchstaben und Unterstriche verwenden. Name des Tags (auch als Kanal); wird bei Bedarf erstellt."
    default: default_channel
    required: true
    selector:
      text:
  send_to_work:
    name: Arbeits-Benachrichtigungen aktivieren
    description: >
      Wenn aktiviert (Standard: false) werden die Geräte in die Benachrichtigungsliste aufgenommen.
    default: false
    required: true
    selector:
      boolean: {}
  action_button_delete:
    name: Löschen-Schaltfläche
    default: Löschen
    selector:
      text:
  additional_message_actions:
    name: Zusätzliche Aktionen
    default: []
    selector:
      object:
  notify_url:
    name: URL für Klickaktion
    default: ""
    required: false
    selector:
      text: {}
  notify_timeout:
    name: Automatisches Löschen (Timeout in Sekunden)
    description: Zeit, nach der die Benachrichtigung vom Handy verschwindet. 0 = bleibt ewig stehen.
    default: 0
    required: false
    selector:
      number:
        min: 0
        max: 86400
        mode: box
  notify_chronometer:
    name: Zeitanzeige (Chronometer)
    description: Soll oben in der Android-Benachrichtigung eine laufende Zeit angezeigt werden?
    default: aus
    required: false
    selector:
      select:
        options:
          - label: Aus
            value: aus
          - label: Stoppuhr (zählt hoch)
            value: stoppuhr
          - label: Countdown (zählt runter)
            value: countdown
  notify_chronometer_duration:
    name: Countdown-Dauer (Sekunden)
    description: Nur nötig, wenn "Countdown" gewählt wurde (z.B. 1800 für 30 Minuten).
    default: 0
    required: false
    selector:
      number:
        min: 0
        max: 86400
        mode: box
  notify_when:
    name: Zeitpunkt (ISO-8601)
    required: false
    selector:
      text: {}
  notify_when_relative:
    name: Zeitpunkt relativ (Sekunden)
    description: Zeitpunkt in N Sekunden ab jetzt, wird relativ angezeigt (z. B. „in 5 Minuten“).
    default: 0
    required: false
    selector:
      number:
        min: 0
        max: 86400
        mode: box
  use_progress:
    name: Fortschrittsbalken benutzen
    default: 0
    required: false
    selector:
      boolean: {}
  act_progress:
    name: Fortschrittsbalken aktuell
    default: 0
    required: false
    selector:
      number:
        mode: box
  max_progress:
    name: Fortschrittsbalken Maximum
    default: 0
    required: false
    selector:
      number:
        mode: box
  notify_devices:
    name: Geräte (optional)
    description: >
      Nur an diese Geräte senden (Mobile-App-Geräte). Leer = Standardgeräte aus dem Blueprint,
      mit „Arbeit“ zusätzlich die Arbeitsgeräte. Für Personen: script.notification_send_oliver / _tina.
    required: false
    selector:
      device:
        multiple: true
        filter:
          - integration: mobile_app
  notify_channel:
    name: Android-Kanal (optional)
    description: Name des Benachrichtigungskanals. Leer = wie der Tag (bisheriges Verhalten). Sinnvoll, wenn der Tag z. B. eine ID enthält.
    required: false
    selector:
      text: {}
  notify_persistent:
    name: Persistente HA-Benachrichtigung
    description: "Zusätzlich eine Benachrichtigung in Home Assistant anlegen (Standard: ja)."
    default: true
    required: false
    selector:
      boolean: {}
  notify_icon:
    name: Icon (optional, nur Android)
    description: Ersetzt das Home-Assistant-Icon in der Benachrichtigung, z. B. mdi:garage-alert.
    required: false
    selector:
      icon: {}
  notify_icon_color:
    name: Icon-Farbe (optional, nur Android)
    description: RGB-Liste (z. B. [255, 152, 0]) oder Hex-String (z. B. "#ff9800").
    required: false
    selector:
      color_rgb: {}

sequence:
  # Blueprint-Inputs binden (eigene Namen, damit sie nicht mit Aufruf-Feldern kollidieren)
  - variables:
      bp_default_devices: !input default_devices
      bp_work_devices: !input work_devices
  - variables:
      notify_chronometer: "{{ notify_chronometer | default('aus') }}"
      notify_chronometer_duration: "{{ notify_chronometer_duration | default(0) }}"
      notify_when: "{{ notify_when | default(false) }}"
      notify_when_relative: "{{ notify_when_relative | default(0) }}"
      notify_url: "{{ notify_url | default('') }}"
      notify_timeout: "{{ notify_timeout | default(0) }}"
      send_to_work: "{{ send_to_work | default(false) }}"
      additional_message_actions: "{{ additional_message_actions | default([]) }}"
      notify_data: "{{ notify_data | default([]) }}"
      use_progress: "{{ use_progress | default(false) }}"
      act_progress: "{{ act_progress | default(0) }}"
      max_progress: "{{ max_progress | default(1) }}"
      notify_channel: "{{ notify_channel | default('') }}"
      notify_persistent: "{{ notify_persistent | default(true) }}"
      notify_icon: "{{ notify_icon | default('') }}"
      notify_icon_color: "{{ notify_icon_color | default('') }}"
      device_message_data: |-
        {% set message = namespace(data={}) %}  {% set actions = [] %}
        {% set message.data = message.data | combine({'car_ui': true}) %}
        {% if additional_message_actions %}
          {% set actions = actions + additional_message_actions %}
        {% endif %}
        {% if 'high_priority' in notify_data %}
          {% set message.data = message.data | combine({'ttl': 0, 'priority': 'high'}) %}
        {% endif %}
        {% if 'alert_once' in notify_data %}
          {% set message.data = message.data | combine({'alert_once': true}) %}
        {% endif %}
        {% set message.data = message.data | combine({'channel': notify_channel if notify_channel else notify_tag, 'tag': notify_tag}) %}
        {% if 'sticky' in notify_data %}
          {% set message.data = message.data | combine({'sticky': true, 'persistent': true}) %}
          {% set actions = actions + [{'action': 'dismiss' + states('input_text.notification_action_tag_separator') + notify_tag, 'title': action_button_delete}] %}
        {% endif %}
        {# 1. Timeout (Automatisches Löschen) #} {% if notify_timeout | int(0) > 0 %}
          {% set message.data = message.data | combine({'timeout': notify_timeout | int(0)}) %}
        {% endif %}
        {# 2. Chronometer (Anzeige) #} {% if notify_chronometer in ['stoppuhr', 'countdown'] %}
          {% if notify_chronometer == 'countdown' and notify_chronometer_duration | int(0) > 0 %}
            {% set ts = (now().timestamp() + (notify_chronometer_duration | int(0))) | int %}
          {% else %}
            {% set ts = now().timestamp() | int %}
          {% endif %}

          {% set message.data = message.data | combine({'chronometer': true, 'when': ts}) %}
        {% else %}
          {# Fallback auf normale Zeit-Optionen, falls KEIN Chronometer aktiv ist #}
          {% if notify_when %}
            {% set ts = as_timestamp(notify_when) | int(0) %}
            {% if ts > 0 %}
              {% set message.data = message.data | combine({'when': ts}) %}
            {% endif %}
          {% elif notify_when_relative | int(0) > 0 %}
            {# Relativer Zeitpunkt: jetzt + N Sekunden als Unix-Zeitstempel #}
            {% set ts = (now().timestamp() + (notify_when_relative | int(0))) | int %}
            {% set message.data = message.data | combine({'when': ts, 'when_relative': true}) %}
          {% endif %}
        {% endif %}
        {% if use_progress %}
          {% set message.data = message.data | combine({'progress': act_progress | float(0) | round(0), 'progress_max': max_progress | float(1) | round(0)}) %}
        {% endif %}
        {% if actions %}
          {% set message.data = message.data | combine({'actions': actions}) %}
        {% endif %}
        {% if notify_url != "" %}
          {% set message.data = message.data | combine({'clickAction': notify_url}) %}
        {% endif %}
        {# Eigenes Icon + Farbe (Android); Farbe als [r, g, b] oder "#rrggbb" #}
        {% if notify_icon %}
          {% set message.data = message.data | combine({'notification_icon': notify_icon}) %}
        {% endif %}
        {% if notify_icon_color is string and notify_icon_color.startswith('#') %}
          {% set message.data = message.data | combine({'color': notify_icon_color}) %}
        {% elif notify_icon_color is sequence and notify_icon_color is not string and notify_icon_color | length == 3 %}
          {% set message.data = message.data | combine({'color': '#%02x%02x%02x' | format(notify_icon_color[0] | int(0), notify_icon_color[1] | int(0), notify_icon_color[2] | int(0))}) %}
        {% endif %}
        {{ message.data }}
      # Eigene Liste beim Aufruf > Standardgeräte (+ Arbeitsgeräte bei send_to_work)
      notify_devices: |-
        {% set gegeben = notify_devices | default([]) %}{% if gegeben %}
          {{ [gegeben] if gegeben is string else gegeben | list }}
        {% else %}
        {% set base = bp_default_devices | list %}

        {% if send_to_work %}
          {{ base + (bp_work_devices | list) }}
        {% else %}
          {{ base }}
        {% endif %}
        {% endif %}
  - alias: Persistente Benachrichtigung (abschaltbar)
    if:
      - condition: template
        value_template: "{{ notify_persistent }}"
    then:
      - alias: Erstelle persistente Benachrichtigung
        action: persistent_notification.create
        data:
          title: "{{ notify_title }}"
          message: "{{ notify_message }}"
          notification_id: "{{ notify_tag }}"
  - alias: Sende eine Benachrichtigung an jedes Gerät
    repeat:
      for_each: "{{ notify_devices }}"
      sequence:
        - variables:
            sensor_entity_id: "sensor.{{ device_attr(repeat.item, 'name') | default('unknown') | slugify }}_active_notification_count"
        - if:
            - condition: template
              value_template: |
                {% set ns = namespace(notification_exists=false) %}
                {% if states(sensor_entity_id) not in ['unknown', 'unavailable'] %}
                  {% for key, value in states[sensor_entity_id].attributes.items() %}
                    {% if key.startswith('android.title_io.homeassistant.companion.android_') %}
                      {% set idx = key.split('_')[-1] %}
                      {% set text_key = "android.text_io.homeassistant.companion.android_" ~ idx %}
                      {% set big_text_key = "android.bigText_io.homeassistant.companion.android_" ~ idx %}

                      {% set msg_text = state_attr(sensor_entity_id, text_key) %}
                      {% set msg_big_text = state_attr(sensor_entity_id, big_text_key) %}

                      {% if value == notify_title and (msg_text == notify_message or msg_big_text == notify_message) %}
                        {% set ns.notification_exists = true %}
                      {% endif %}
                    {% endif %}
                  {% endfor %}
                {% endif %}
                {{ not ns.notification_exists }}
          then:
            - action: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | default('unknown') | slugify }}"
              data:
                title: "{{ notify_title }}"
                message: "{{ notify_message }}"
                data: "{{ device_message_data }}"
  - action: script.telegram_benachrichtigung_loschen
    metadata: {}
    data:
      notify_tag: "{{ notify_tag }}"
    enabled: false
  - alias: Sende Telegram-Benachrichtigung mit Rückkanal
    response_variable: telegram_result
    data:
      config_entry_id: !input telegram_config_entry
      message: "{{ notify_message }}"
      title: "{{ notify_title }}"
      message_tag: "{{ notify_tag }}"
      inline_keyboard: |
        {% if device_message_data.actions and notify_url %}
          [[
            {% for action in device_message_data.actions %}
              {% if (action.action | length) + 1 < 64 %}
                ["{{ action.title }}","{{ action.action }}"]

                {% if not loop.last %}, {% endif %}
              {% endif %}
            {% endfor %}
          ,["Öffnen","{{ notify_url }}"]]]
        {% elif device_message_data.actions %}
          [[
            {% for action in device_message_data.actions %}
              ["{{ action.title }}","{{ action.action }}"]{% if not loop.last %}, {% endif %}
            {% endfor %}
          ]]
        {% elif notify_url %}
          [[["Öffnen","{{ notify_url }}"]]]
        {% else %}
          [[]]
        {% endif %}
    action: telegram_bot.send_message
    enabled: false
  - alias: Speichere Telegram-Nachrichten Mapping
    data:
      tag: "{{ notify_tag }}"
      chat_id: "{{ telegram_result.chats[0].chat_id | default('') }}"
      message_id: "{{ telegram_result.chats[0].message_id | default('') }}"
      title: "{{ notify_title }}"
      message: "{{ notify_message }}"
      actions: "{{ additional_message_actions }}"
      telegram_result: "{{ telegram_result }}"
    action: shell_command.telegram_add_message_by_tag
    enabled: false
