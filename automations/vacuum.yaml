blueprint:
  source_url: "https://raw.githubusercontent.com/tefracky-organization/homeassistant-blueprints/blueprints/automations/vacuum.yaml"
  name: Staubsauger-Zeitplan mit Benachrichtigungssteuerung
  description: >
    🧹 **Staubsauger-Zeitplan mit Benachrichtigungssteuerung & Urlaubsmodus**

    Diese Automation verwendet die [Scheduler-Komponente von nielsfaber](https://github.com/nielsfaber/scheduler-component),
    um Reinigungszeitpläne für deinen Staubsauger zu verwalten. Sie bietet zwei Betriebsmodi:

    1.  **Normalbetrieb:** Statt automatisch zu starten, erhältst du eine smarte Push-Benachrichtigung,
        mit der du selbst entscheidest, wann die Reinigung beginnt.
    2.  **Urlaubsmodus:** Wenn ein von dir definierter Schalter (input_boolean) aktiviert ist,
        startet der Staubsauger zum geplanten Zeitpunkt **sofort und ohne Nachfrage**.

    📅 **Zeitplan & Modus:**

    - Die Reinigungszeiten werden über Zeitpläne in der `scheduler-card` festgelegt.
    - Der gewünschte Reinigungsmodus (`quiet`, `balanced`, `turbo`, `max`) wird direkt aus dem Namen des Buttons abgeleitet.

    📲 **Benachrichtigungssteuerung (im Normalbetrieb):**

    - Wenn ein Zeitplan ausgelöst wird, erhältst du eine Push-Nachricht mit den Optionen:
      - ✅ **Start** – startet den Staubsauger mit dem gewünschten Modus
      - ❌ **Abbrechen** – bricht den Vorgang ab
    - Während der Reinigung kannst du:
      - ⏸ **Pausieren**
      - 🛑 **Stoppen**
      - 🏠 **Zurück zur Ladestation schicken**
    - Statusmeldungen erscheinen automatisch, z. B. wenn der Sauger startet, pausiert oder zurückkehrt.


    🛠 **Voraussetzungen:**

    - [Scheduler-Integration](https://github.com/nielsfaber/scheduler-component) (HACS)
    - [Scheduler-Card](https://github.com/nielsfaber/scheduler-card) (HACS - optional, aber empfohlen)
    - Ein `input_boolean` als Schalter für den Urlaubsmodus.
    - Zeitplan mit `input_button`, in dessen Name der Reinigungsmodus steckt (z. B. `input_button.vacuum_downstairs_start_turbo`)
    - Staubsauger mit Unterstützung für `fan_speed` (z. B. Roborock)


    🔗 **Credits:**

    - [Original-Blaupause](https://raw.githubusercontent.com/travipross/ha-blueprints/refs/heads/main/automations/scheduled-vacuum-with-notifications.yaml)

    - [Community-Diskussion](https://community.home-assistant.io/t/snoozable-vacuum-schedule-with-notification-control/822267)

  input:
    vacuum_entity_id:
      name: Die Entität deines Staubsaugers
      description: Die Entität deines Staubsaugers
      selector:
        entity:
          domain: vacuum
          integration: roborock
    trigger_button:
      name: Zeitplan-Trigger
      description: Die Button-Entität deines Zeitplans, der vom Scheduler ausgelöst wird.
      selector:
        entity:
          domain: input_button
          multiple: true
    notify_tag:
      name: Benachrichtigungstag
      description: "Der Tag, der für Benachrichtigungen verwendet wird (z. B. 'roborock_unten' oder 'roborock_oben')."
      selector:
        text:

  domain: automation

mode: queued
max: 5

variables:
  vacuum_entity_id: !input vacuum_entity_id
  vacuum_friendly_name: "{{ state_attr(vacuum_entity_id, 'friendly_name') }}"
  trigger_button: !input trigger_button
  notify_tag: !input notify_tag
  suction_mode: >
    {% set result = state_attr(vacuum_entity_id, 'fan_speed') %}
    {% if trigger.entity_id is defined and "input_button.vacuum_" in trigger.entity_id %}
      {% set result = trigger.entity_id | regex_replace(find='^input_button\\.vacuum_[^_]+_start_', replace='') | string %}
    {% endif %}
    {{ result }}
  suction_mode_name: >
    {% set suction_mapping = {
      "off": "Aus",
      "quiet": "Leise",
      "balanced": "Ausgewogen",
      "turbo": "Turbo",
      "max": "Maximum",
      "custom": "Benutzerdefiniert"
    } %}
    {{ suction_mapping.get(suction_mode, "Ungültig (" ~ suction_mode ~ ")") }}

triggers:
  - alias: "Scheduler: Zeitplan ausgelöst"
    trigger: state
    entity_id: !input trigger_button
    id: schedule_start

  - alias: "Benachrichtigungsaktion empfangen App"
    trigger: event
    event_type: mobile_app_notification_action
    id: action_app

  - alias: "Benachrichtigungsaktion empfangen Telegram"
    trigger: event
    event_type: telegram_callback
    id: action_telegram

  - alias: "Staubsaugerstatus: an der Ladestation angedockt"
    trigger: state
    entity_id: !input vacuum_entity_id
    to: docked
    id: vacuum_docked

  - alias: "Staubsaugerstatus: Reinigung gestartet"
    trigger: state
    entity_id: !input vacuum_entity_id
    to: cleaning
    id: vacuum_started

  - alias: "Staubsaugerstatus: inaktiv"
    trigger: state
    entity_id: !input vacuum_entity_id
    to: idle
    id: vacuum_idle

  - alias: "Staubsaugerstatus: pausiert"
    trigger: state
    entity_id: !input vacuum_entity_id
    to: paused
    id: vacuum_paused

  - alias: "Staubsaugerstatus: kehrt zur Ladestation zurück"
    trigger: state
    entity_id: !input vacuum_entity_id
    to: returning
    id: vacuum_returning

conditions: []

action:
  - choose:
      - alias: "AKTION 1: Zeitplan wurde ausgelöst"
        conditions:
          - condition: trigger
            id: schedule_start
        sequence:
          - alias: "Schritt 1: Saugkraft immer setzen, egal ob Urlaubsmodus oder nicht."
            action: vacuum.set_fan_speed
            target:
              entity_id: "{{ vacuum_entity_id }}"
            data:
              fan_speed: "{{ suction_mode }}"
          - alias: "Schritt 2: Prüfen, ob der Urlaubsmodus an ist."
            choose:
              - alias: "FALL 1.1: Urlaubsmodus ist AN - er Staubsauger startet sofort ohne Nachfrage."
                conditions:
                  - condition: state
                    entity_id: input_boolean.vacation
                    state: 'on'
                sequence:
                  - service: vacuum.start
                    target:
                      entity_id: "{{ vacuum_entity_id }}"
                    alias: "Staubsauger im Urlaubsmodus direkt starten"
            default:
              - alias: "FALL 1.2: Urlaubsmodus ist AUS (Standard) - Eine Benachrichtigung wird gesendet, um den Start zu bestätigen."
                service: script.notification_send
                data:
                  notify_title: "{{ vacuum_friendly_name }} einsatzbereit"
                  notify_message: >
                    Der Zeitplan wurde ausgelöst. Saugmodus: '{{ suction_mode_name }}'.
                    Tippe auf 'Start', um zu beginnen, oder 'Löschen', um abzubrechen.
                  notify_tag: "{{ notify_tag }}"
                  notify_data:
                    - high_priority
                    - sticky
                  send_car: false
                  action_button_delete: "Löschen"
                  additional_message_actions:
                    - action: "{{ 'start' + states('input_text.notification_action_tag_separator') + notify_tag }}"
                      title: "Start"

      - alias: "AKTION 2: Auf eine Benachrichtigungsaktion reagieren"
        conditions:
          - condition: trigger
            id:
              - action_app
              - action_telegram
        sequence:
          - alias: "Unterskript aufrufen und action/tag zurückgeben"
            service: script.benachrichtigung_event_daten_auslesen
            data:
              event_data: "{{ trigger.event.data }}"
            response_variable: result
          - variables:
              action: "{{ result.action }}"
              tag: "{{ result.tag }}"
          - condition: template
            value_template: "{{ notify_tag == tag }}"
            alias: "Prüfen, ob der Tag zur Automation passt"
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ action == 'start' }}"
                sequence:
                  - service: vacuum.start
                    target:
                      entity_id: "{{ vacuum_entity_id }}"
                    alias: "Staubsauger starten"
              - conditions:
                  - condition: template
                    value_template: "{{ action == 'dock' }}"
                sequence:
                  - service: vacuum.return_to_base
                    target:
                      entity_id: "{{ vacuum_entity_id }}"
                    alias: "Staubsauger zur Ladestation schicken"
              - conditions:
                  - condition: template
                    value_template: "{{ action == 'pause' }}"
                sequence:
                  - service: vacuum.pause
                    target:
                      entity_id: "{{ vacuum_entity_id }}"
              - conditions:
                  - condition: template
                    value_template: "{{ action == 'stop' }}"
                sequence:
                  - service: vacuum.stop
                    target:
                      entity_id: "{{ vacuum_entity_id }}"
      - alias: "AKTION 3: Reinigung wurde gestartet"
        conditions:
          - condition: trigger
            id: vacuum_started
        sequence:
          - service: script.notification_send
            data:
              notify_title: "{{ vacuum_friendly_name }} reinigt"
              notify_message: "Der Saugroboter reinigt jetzt im Modus '{{ suction_mode_name }}'."
              notify_tag: "{{ notify_tag }}"
              notify_data:
                - high_priority
                - sticky
              send_car: false
              action_button_delete: "Löschen"
              additional_message_actions:
                - action: "{{ 'pause' + states('input_text.notification_action_tag_separator') + notify_tag }}"
                  title: "Pause"
                - action: "{{ 'stop' + states('input_text.notification_action_tag_separator') + notify_tag }}"
                  title: "Stop"
                - action: "{{ 'dock' + states('input_text.notification_action_tag_separator') + notify_tag }}"
                  title: "Dock"
            alias: "Benachrichtigung 'Reinigung gestartet' senden"
      - alias: "AKTION 4: Reinigung wurde pausiert"
        conditions:
          - condition: trigger
            id: vacuum_paused
        sequence:
          - service: script.notification_send
            data:
              notify_title: "{{ vacuum_friendly_name }} pausiert"
              notify_message: "Der Saugroboter ist pausiert."
              notify_tag: "{{ notify_tag }}"
              notify_data:
                - high_priority
                - sticky
              send_car: false
              action_button_delete: "Löschen"
              additional_message_actions:
                - action: "{{ 'start' + states('input_text.notification_action_tag_separator') + notify_tag }}"
                  title: "Fortsetzen"
                - action: "{{ 'dock' + states('input_text.notification_action_tag_separator') + notify_tag }}"
                  title: "Dock"
            alias: "Benachrichtigung 'Pausiert (paused)' senden"
      - alias: "AKTION 5: Reinigung ist inaktiv/gestoppt"
        conditions:
          - condition: trigger
            id: vacuum_idle # Korrigiert von vacuum_paused
        sequence:
          - service: script.notification_send
            data:
              notify_title: "{{ vacuum_friendly_name }} gestoppt"
              notify_message: "Der Saugroboter ist inaktiv."
              notify_tag: "{{ notify_tag }}"
              notify_data:
                - high_priority
                - sticky
              send_car: false
              action_button_delete: "Löschen"
              additional_message_actions:
                - action: "{{ 'start' + states('input_text.notification_action_tag_separator') + notify_tag }}"
                  title: "Start"
                - action: "{{ 'dock' + states('input_text.notification_action_tag_separator') + notify_tag }}"
                  title: "Dock"
            alias: "Benachrichtigung 'Gestoppt (idle)' senden"
      - alias: "AKTION 6: Staubsauger kehrt zur Basis zurück"
        conditions:
          - condition: trigger
            id: vacuum_returning
        sequence:
          - service: script.notification_send
            data:
              notify_title: "{{ vacuum_friendly_name }} kehrt zur Ladestation zurück"
              notify_message: "Der Saugroboter ist auf dem Rückweg."
              notify_tag: "{{ notify_tag }}"
              notify_data:
                - high_priority
                - sticky
              send_car: false
              action_button_delete: "Löschen"
              additional_message_actions:
                - action: "{{ 'pause' + states('input_text.notification_action_tag_separator') + notify_tag }}"
                  title: "Pause"
            alias: "Benachrichtigung 'Rückkehr' senden"
      - alias: "AKTION 7: Staubsauger ist angedockt"
        conditions:
          - condition: trigger
            id: vacuum_docked
        sequence:
          - service: script.notification_delete
            data:
              notify_tag: "{{ notify_tag }}"
            alias: "Benachrichtigung löschen"
